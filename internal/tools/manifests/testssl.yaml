name: testssl
description: TLS/SSL vulnerability and protocol assessment.
category: vulnerability
homepage: https://testssl.sh/
documentation: https://testssl.sh/doc/
license: GPL-2.0
binary: testssl
min_version: 3.2.0
tested_version: 3.2.1
architectures: [any]
risk: low
intrusive: false
capabilities: [tls_assessment, protocol_analysis, certificate_analysis]
outputs: [text, json, html]
version_check:
  args: ["--version"]
  regex: '(?i)testssl.*?version.*?([0-9]+\.[0-9]+\.[0-9]+)'
install:
  - method: github_release
    repository: https://github.com/drwetter/testssl.sh
    notes: Download the official release script for your platform.
  - method: manual
    notes: Use a reviewed release of the official repository.
usage:
  target_mode: hostport
  default_ports: [443, 8443, 9443, 465, 993, 995, 636, 853]
invocations:
  - name: full
    description: Full protocol, cipher, header and vulnerability assessment.
    mode: vuln
    uses_captured_ports: true
    args: ["--quiet", "--warnings", "off", "--jsonfile", "{{out}}"]
    repeat: 3
    accept_exit_codes: [0, 1]

