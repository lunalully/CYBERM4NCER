name: gobuster
description: Directory, vhost and DNS enumeration.
category: web
homepage: https://github.com/OJ/gobuster
documentation: https://github.com/OJ/gobuster
license: Apache-2.0
binary: gobuster
min_version: 3.6.0
tested_version: 3.6.0
architectures: [amd64, arm64, 386, arm]
risk: medium
intrusive: true
capabilities: [directory_enumeration, vhost_discovery, dns_enumeration]
outputs: [text]
version_check:
  args: ["--version"]
  regex: '(?i)gobuster version\s+v?([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
install:
  - method: go
    package: github.com/OJ/gobuster/v3@v3.6.0
  - method: apt
    package: gobuster
  - method: manual
    notes: Build from a reviewed release of the official repository.
usage:
  target_mode: free
  speed_args:
    3: ["-t", "50"]
    4: ["-t", "100"]
    5: ["-t", "200"]
invocations:
  - name: dir-enum
    description: Directory and file discovery with the supplied wordlist.
    mode: enum
    args: ["dir", "-q", "--no-error", "--no-progress", "-k"]
    repeat: 3
    options:
      - {name: url, flag: "-u"}
      - {name: wordlist, flag: "-w"}
      - {name: extensions, flag: "-x"}
      - {name: statuscodes, flag: "-s"}
  - name: dns-enum
    description: DNS subdomain brute force against the domain.
    mode: enum
    args: ["dns", "-q", "--no-error", "--no-progress"]
    repeat: 3
    options:
      # {{target}} is the domain.
      - {name: domain, flag: "-d", value: "{{target}}"}
      - {name: wordlist, flag: "-w"}
  - name: vhost-enum
    description: Virtual host discovery against the URL.
    mode: enum
    args: ["vhost", "-q", "--no-error", "--no-progress"]
    repeat: 3
    options:
      - {name: url, flag: "-u"}
      - {name: wordlist, flag: "-w"}

