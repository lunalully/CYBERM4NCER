name: dnsx
description: Fast DNS toolkit for resolution and enumeration.
category: recon
homepage: https://github.com/projectdiscovery/dnsx
documentation: https://docs.projectdiscovery.io/tools/dnsx/overview
license: MIT
binary: dnsx
min_version: 1.2.0
tested_version: 1.3.1
architectures: [amd64, arm64, 386, arm]
risk: low
intrusive: false
capabilities: [dns_enumeration, dns_resolution]
outputs: [text, jsonl]
version_check:
  args: ["-version"]
  regex: '(?i)current version:\s*v?([0-9]+\.[0-9]+\.[0-9]+)'
install:
  - method: go
    package: github.com/projectdiscovery/dnsx/cmd/dnsx@v1.3.1
  - method: manual
    notes: Build from a reviewed release of the official repository.
usage:
  target_mode: host
  target_flags: ["-d"]
invocations:
  - name: brute
    description: Brute-forces subdomains with the built-in wordlist.
    mode: enum
    args: ["-silent", "-a", "-resp", "-w", "{{wordlist}}"]
    repeat: 3
    options:
      - {name: domain, flag: "-d"}
  - name: resolve
    description: Resolves names and records A records.
    mode: recon
    args: ["-silent", "-a", "-resp"]
    repeat: 1
    options:
      - {name: domain, flag: "-d"}

