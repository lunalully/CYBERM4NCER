name: sslscan
description: TLS configuration and cipher assessment.
category: vulnerability
homepage: https://github.com/rbsec/sslscan
documentation: https://github.com/rbsec/sslscan
license: GPL-3.0
binary: sslscan
min_version: 2.1.0
tested_version: 2.1.5
architectures: [any]
risk: low
intrusive: false
capabilities: [tls_assessment, cipher_enumeration]
outputs: [text, xml]
version_check:
  args: ["--version"]
  regex: '([0-9]+\.[0-9]+\.[0-9]+)'
install:
  - method: apt
    package: sslscan
  - method: manual
    notes: Use the distribution package or the official reviewed release.
usage:
  target_mode: hostport
  default_ports: [443, 8443, 9443, 465, 993, 995, 636, 853]
invocations:
  - name: full
    description: Full cipher, protocol and vulnerability scan on each TLS port.
    mode: vuln
    uses_captured_ports: true
    args: ["--show-certificate", "--show-client-cas", "--no-colour", "--xml", "{{out}}"]
    repeat: 3
    accept_exit_codes: [0, 1]

