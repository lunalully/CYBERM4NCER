name: nc
description: TCP/UDP connection and banner-grab utility (traditional netcat).
category: network
homepage: https://nc110.sourceforge.io/
documentation: https://manpages.debian.org/testing/netcat-traditional/nc.traditional.1.en.html
license: GPL-2.0
binary: nc
min_version: 1.10.0
tested_version: 1.10.0
architectures: [amd64, arm64, 386, arm]
risk: medium
intrusive: true
capabilities: [banner_grab, port_connect, service_detection, raw_tcp]
outputs: [text]
version_check:
  args: ["-h"]
  regex: '^\[v([0-9]+\.[0-9]+-[0-9]+)\]'
  accept_exit_codes: [0, 1]
install:
  - method: apt
    package: netcat-traditional
  - method: manual
    notes: Use the distribution package. Different netcat variants expose different flags; this manifest targets netcat-traditional.
usage:
  # The position review is the target first, then its port.
  target_mode: hostport
  default_ports: [21, 22, 23, 25, 80, 110, 143, 443, 465, 587, 993, 995, 1433, 3306, 3389, 5432, 5900, 6379, 8080, 8443, 9200, 11211, 27017]
invocations:
  - name: banner
    description: Opens a raw TCP connection per port to capture a service banner.
    mode: enum
    # {{host:port}} is the target, then the positional port.
    args: ["-v", "-w", "3"]
    repeat: 3
    uses_captured_ports: true
    accept_exit_codes: [0, 1]
notes: The version check uses -h because netcat-traditional has no --version flag. Output is discarded unless a banner is printed.