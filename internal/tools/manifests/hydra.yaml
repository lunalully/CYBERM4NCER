name: hydra
description: Parallel network login brute-forcer for service credential checks.
category: vulnerability
homepage: https://github.com/vanhauser-thc/thc-hydra
documentation: https://github.com/vanhauser-thc/thc-hydra
license: AGPL-3.0
binary: hydra
min_version: 9.0.0
tested_version: 9.5.0
architectures: [amd64, arm64, 386, arm]
risk: critical
intrusive: true
capabilities: [credential_testing, password_spraying, service_bruteforce]
outputs: [text]
version_check:
  args: ["-h"]
  regex: '(?i)Hydra\s+v?([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
  accept_exit_codes: [0, 255]
install:
  - method: apt
    package: hydra
  - method: manual
    notes: Use the distribution package or a reviewed build of the official repository.
usage:
  target_mode: cidr
  default_ports: [21, 22, 23, 25, 110, 143, 389, 445, 1433, 3306, 3389, 5432, 5433, 5900, 5985, 5986, 6379, 8080, 8443]
  speed_args:
    3: ["-t", "16"]
    4: ["-t", "32"]
    5: ["-t", "64"]
invocations:
  - name: brute-common-protocols
    description: Tries the supplied user/password lists against common protocols.
    mode: credential
    args: []
    repeat: 2
    accept_exit_codes: [0, 255]
    success_regex: '(?i)\[\d+\]\[[^\]]+\]\s+host:\s+\S+\s+.*login:\s+\S+\s+password:\s+\S+'
    options:
      - {name: protocol, flag: ""}
      - {name: userlist, flag: "-L"}
      - {name: passlist, flag: "-P"}
notes: |
  Credential attacks can lock out real accounts, trip account protection and are
  illegal without written authorization. Credential invocations require
  operator-supplied wordlists in the operation options.