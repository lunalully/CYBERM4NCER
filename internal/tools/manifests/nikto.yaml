name: nikto
description: Web server misconfiguration and known-issue scanner.
category: vulnerability
homepage: https://github.com/sullo/nikto
documentation: https://github.com/sullo/nikto/wiki
license: GPL-2.0
binary: nikto
min_version: 2.1.5
tested_version: 2.1.5
architectures: [any]
risk: medium
intrusive: true
capabilities: [misconfiguration_assessment, web_server_scanning]
outputs: [text, json, csv, xml]
version_check:
  args: ["-Version"]
  regex: '(?i)Nikto main\s+([0-9]+\.[0-9]+\.[0-9]+)'
install:
  - method: apt
    package: nikto
  - method: manual
    notes: Use the distribution package or the official reviewed release.
usage:
  target_mode: url
  url_paths: ["/"]
  speed_args:
    3: ["-Tuning", "123b"]
    4: ["-Tuning", "1234567890abc"]
    5: ["-Tuning", "1234567890abc", "-Pause", "0"]
invocations:
  - name: full-scan
    description: Full plugin run with all tuning classes.
    mode: vuln
    args: ["-nointeractive", "-ask", "no", "-Format", "json", "-output", "{{out}}"]
    repeat: 3
    accept_exit_codes: [0, 1]

