name: feroxbuster
description: Recursive content discovery and directory enumeration.
category: web
homepage: https://github.com/epi052/feroxbuster
documentation: https://epi052.github.io/feroxbuster-docs/
license: MIT
binary: feroxbuster
min_version: 2.10.0
tested_version: 2.13.1
architectures: [amd64, arm64]
risk: medium
intrusive: true
capabilities: [content_discovery, directory_enumeration]
outputs: [text, json]
version_check:
  args: ["--version"]
  regex: '(?i)feroxbuster\s+v?([0-9]+\.[0-9]+\.[0-9]+)'
install:
  - method: github_release
    repository: https://github.com/epi052/feroxbuster
    notes: Download the official binary for your architecture.
  - method: cargo
    package: feroxbuster
    notes: Pin the tested release with cargo install feroxbuster --version 2.13.1.
  - method: manual
    notes: Build from a reviewed release of the official repository.
usage:
  target_mode: url
  target_flags: ["-u"]
  url_paths: ["/"]
  speed_args:
    3: ["-t", "50"]
    4: ["-t", "100"]
    5: ["-t", "150"]
invocations:
  - name: dir-enum
    description: Recursive content discovery with redirects and auto-tuning.
    mode: enum
    args: ["-q", "--json", "-d", "5", "-k", "--smart", "--auto-tune", "-o", "{{out}}"]
    repeat: 3
    accept_exit_codes: [0, 1]
    options:
      - {name: wordlist, flag: "-w"}

