name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./internal/core ./internal/scope ./internal/execution ./internal/database
      - name: Build amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/cyberm4ncer-amd64 ./cmd/cyberm4ncer
      - name: Build arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/cyberm4ncer-arm64 ./cmd/cyberm4ncer